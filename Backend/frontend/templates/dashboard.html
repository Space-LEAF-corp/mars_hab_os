<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mars Habitat OS – Dashboard</title>
  <link rel="stylesheet" href="/static/css/mars.css">
</head>
<body class="mars-desktop">
  <header class="top-bar">
    <span id="user-label"></span>
    <span class="top-bar-right">Location: Mars Habitat • Link: Earth</span>
  </header>

  <main class="desktop-grid">
    <section class="widget earth-news">
      <h2>Earth News Link</h2>
      <ul id="earth-news-list">
        <li>Loading Earth feed…</li>
      </ul>
    </section>

    <section class="widget classrooms">
      <h2>Connected Classrooms</h2>
      <ul id="classroom-list">
        <li>Loading classroom interfaces…</li>
      </ul>
    </section>
  </main>

  <script src="/static/js/mars.js"></script>
</body>
</html>
