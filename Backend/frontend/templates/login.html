<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mars Habitat OS – Login</title>
  <link rel="stylesheet" href="/static/css/mars.css">
</head>
<body class="mars-bg">
  <div class="login-container">
    <h1>Mars Habitat OS</h1>
    <form id="login-form">
      <input type="text" id="username" placeholder="Crew ID" required />
      <input type="password" id="password" placeholder="Access Code" required />
      <button type="submit">Enter Habitat</button>
    </form>
    <div id="login-error"></div>
  </div>
  <script src="/static/js/mars.js"></script>
</body>
</html>
